<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日子有你 · 两个人的小事</title>
  <style>
    :root {
      --bg: #fbf8f4;
      --bg-wash: #fff1ec;
      --panel: #fffdfb;
      --panel-soft: #fff8f5;
      --text: #30333d;
      --text-soft: #686a76;
      --muted: #9a9ba5;
      --line: #eee4df;
      --line-strong: #e5d1cb;
      --accent: #e9788d;
      --accent-dark: #bf4f69;
      --accent-soft: #fde5e4;
      --peach: #f6b38f;
      --honey: #f3c66f;
      --sage: #a8c8bd;
      --blue: #86b8d6;
      --shadow: 0 18px 46px rgba(112, 78, 71, 0.09);
      --shadow-small: 0 9px 22px rgba(112, 78, 71, 0.08);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    body.theme-blue {
      --bg: #f6f9fb;
      --bg-wash: #e9f4f9;
      --panel: #fcfeff;
      --panel-soft: #f2f9fc;
      --text: #2f3740;
      --text-soft: #5f6c77;
      --muted: #929ea7;
      --line: #e0ebf0;
      --line-strong: #c9dfe8;
      --accent: #68a9cb;
      --accent-dark: #327b9f;
      --accent-soft: #dff1f8;
      --peach: #e9b993;
      --honey: #efc670;
      --sage: #9fc7bd;
      --blue: #80afd0;
      --shadow: 0 18px 46px rgba(65, 109, 128, 0.1);
      --shadow-small: 0 9px 22px rgba(65, 109, 128, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { color: var(--text); background: var(--bg); font-family: "Avenir Next", "Segoe UI Variable", "PingFang SC", "Microsoft YaHei", sans-serif; transition: background .3s ease, color .3s ease; }
    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .page { width: min(1120px, calc(100vw - 44px)); margin: 0 auto; padding: 24px 0 66px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--text); }
    .brand-mark { width: 42px; height: 42px; border-radius: 15px; display: inline-flex; align-items: center; justify-content: center; color: #fff; background: var(--accent); box-shadow: 0 10px 20px rgba(233, 120, 141, .24); transform: rotate(-6deg); }
    .brand-mark svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .brand-name { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0; }
    .topbar-actions { display: flex; align-items: center; gap: 10px; }
    .theme-button { border: 1px solid var(--line); background: var(--panel); color: var(--text-soft); box-shadow: var(--shadow-small); }
    .theme-button, .topbar-button, .icon-button, .filter-chip, .check-button { cursor: pointer; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease, color .2s ease; }
    .theme-button { width: 40px; height: 40px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; }
    .theme-button svg, .topbar-button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .topbar-button { position: relative; width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text-soft); display: inline-flex; align-items: center; justify-content: center; box-shadow: var(--shadow-small); }
    .topbar-button.sync-state { cursor: default; }
    .topbar-button.sync-state::after { content: ""; position: absolute; right: 6px; bottom: 6px; width: 8px; height: 8px; border: 2px solid var(--panel); border-radius: 50%; background: var(--honey); }
    .topbar-button.sync-state.is-online::after { background: var(--sage); }
    .topbar-button.sync-state.is-error::after { background: var(--accent); }
    .theme-button:hover, .theme-button:focus-visible, .topbar-button:not(.sync-state):hover, .topbar-button:not(.sync-state):focus-visible, .filter-chip:hover, .filter-chip:focus-visible, .icon-button:hover, .icon-button:focus-visible, .check-button:hover, .check-button:focus-visible { transform: translateY(-1px); border-color: var(--line-strong); box-shadow: var(--shadow-small); outline: none; }
    .panel { border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--panel); box-shadow: var(--shadow); }

    .welcome { position: relative; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr); min-height: 294px; margin-bottom: 18px; overflow: hidden; background: var(--accent-soft); border-color: transparent; }
    .welcome-copy { padding: 34px 34px 30px; position: relative; z-index: 1; }
    .welcome-title { max-width: 600px; margin: 0 0 12px; font-size: clamp(30px, 4.5vw, 48px); line-height: 1.1; letter-spacing: 0; }
    .welcome-visual { position: relative; min-height: 250px; display: flex; align-items: center; justify-content: center; }
    .visual-sun { position: absolute; width: 214px; height: 214px; border-radius: 50%; background: #ffd7c7; opacity: .86; }
    .visual-scribble { position: absolute; top: 26px; right: 42px; color: var(--accent); font-size: 28px; transform: rotate(12deg); }
    .visual-scribble.second { top: auto; right: auto; left: 28px; bottom: 42px; color: var(--honey); font-size: 18px; transform: rotate(-16deg); }
    .couple-figures { position: relative; z-index: 1; display: flex; align-items: flex-end; gap: 15px; transform: translateY(12px); }
    .person { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .person-bubble { width: auto; min-width: 78px; max-width: 150px; height: 78px; padding: 0 15px; display: inline-flex; align-items: center; justify-content: center; border: 7px solid var(--panel); border-radius: 50px; color: #fff; font-size: 21px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 12px 24px rgba(142, 89, 82, .15); }
    .person:first-child .person-bubble { background: var(--peach); transform: rotate(-7deg); }
    .person:last-child .person-bubble { background: var(--sage); transform: rotate(7deg); }
    .heart-connector { width: 36px; height: 36px; margin-bottom: 50px; color: var(--accent); display: inline-flex; align-items: center; justify-content: center; }
    .heart-connector svg { width: 32px; height: 32px; stroke: currentColor; fill: currentColor; stroke-width: 1.4; }
    .welcome-footer { display: flex; align-items: center; gap: 16px; margin-top: 26px; }
    .progress-track { width: min(275px, 55vw); height: 9px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.8); }
    .progress-fill { width: 0%; height: 100%; border-radius: inherit; background: var(--accent); transition: width .35s ease; }
    .anniversary-panel { padding: 24px; }
    .new-anniversary-button { min-height: 34px; padding: 0 11px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--panel-soft); color: var(--accent-dark); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
    .new-anniversary-button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .new-anniversary-button:hover, .new-anniversary-button:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
    .anniversary-list { display: grid; gap: 10px; }
    .anniversary-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px 14px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--panel-soft); }
    .anniversary-card-main { min-width: 0; }
    .anniversary-card-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .anniversary-name { margin: 0 0 4px; font-size: 14px; font-weight: 700; line-height: 1.5; word-break: break-word; }
    .anniversary-meta { margin: 0; color: var(--text-soft); font-size: 12px; line-height: 1.6; }
    .anniversary-days { margin: 0; color: var(--accent-dark); font-size: 12px; font-weight: 700; white-space: nowrap; }
    .anniversary-empty { padding: 20px 12px; }
    .anniversary-modal { position: fixed; inset: 0; z-index: 45; display: none; place-items: center; padding: 22px; background: rgba(48, 43, 44, .28); backdrop-filter: blur(8px); }
    .anniversary-modal.is-open { display: grid; }
    .anniversary-dialog { width: min(420px, 100%); padding: 27px; border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--panel); box-shadow: 0 24px 70px rgba(78, 57, 55, .2); }
    .anniversary-dialog-head { display: flex; align-items: start; justify-content: space-between; gap: 14px; margin-bottom: 21px; }
    .anniversary-dialog-title { margin: 0; font-size: 24px; line-height: 1.3; }
    .modal-close { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-soft); color: var(--text-soft); cursor: pointer; font-size: 20px; line-height: 1; }
    .modal-close:hover, .modal-close:focus-visible { color: var(--accent-dark); border-color: var(--line-strong); outline: none; }
    .anniversary-form { display: grid; gap: 13px; }
    .anniversary-label { display: grid; gap: 7px; color: var(--text-soft); font-size: 12px; font-weight: 700; }
    .anniversary-field { width: 100%; min-height: 48px; padding: 0 13px; border: 1px solid var(--line); border-radius: 13px; color: var(--text); background: var(--panel-soft); outline: none; }
    .anniversary-field:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .anniversary-form-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 5px; }
    .modal-button { min-height: 42px; padding: 0 15px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel-soft); color: var(--text-soft); cursor: pointer; font-size: 13px; font-weight: 700; }
    .modal-button.is-primary { border-color: transparent; color: #fff; background: var(--accent); }
    .modal-button:hover, .modal-button:focus-visible { border-color: var(--line-strong); outline: none; }
    .modal-button.is-primary:hover, .modal-button.is-primary:focus-visible { background: var(--accent-dark); }

    .workspace { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr); gap: 18px; align-items: start; }
    .main-column, .side-column { display: grid; gap: 18px; min-width: 0; }
    .composer { padding: 22px; }
    .composer-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .section-title { margin: 0; font-size: 19px; letter-spacing: 0; }
    .composer-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
    .todo-input { width: 100%; min-height: 52px; padding: 0 17px; border: 1px solid var(--line); border-radius: var(--radius-md); color: var(--text); background: var(--panel-soft); outline: none; transition: border-color .2s ease, box-shadow .2s ease, background .2s ease; }
    .todo-input::placeholder, .reflection-input::placeholder { color: #b0adb0; }
    .todo-input:focus, .reflection-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); background: var(--panel); }
    .add-button { min-width: 104px; min-height: 52px; padding: 0 17px; border: 0; border-radius: var(--radius-md); background: var(--accent); color: #fff; cursor: pointer; font-weight: 700; box-shadow: 0 12px 24px rgba(233,120,141,.22); transition: transform .2s ease, background .2s ease, box-shadow .2s ease; }
    .add-button:hover, .add-button:focus-visible { transform: translateY(-1px); background: var(--accent-dark); box-shadow: 0 15px 26px rgba(233,120,141,.28); outline: none; }
    .task-panel, .memory-panel, .mini-panel { padding: 24px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 17px; }
    .count-badge { min-width: 28px; height: 25px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--accent-soft); color: var(--accent-dark); font-size: 12px; font-weight: 700; }
    .date-filter { display: flex; gap: 8px; overflow-x: auto; margin: 0 0 18px; padding-bottom: 3px; scrollbar-width: thin; }
    .filter-chip { flex: 0 0 auto; min-height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel-soft); color: var(--text-soft); font-size: 12px; cursor: pointer; }
    .filter-chip.is-active { border-color: transparent; background: var(--accent); color: #fff; box-shadow: 0 8px 16px rgba(233,120,141,.18); }
    .todo-list, .journal-list { display: grid; gap: 11px; }
    .content-fade { opacity: 1; transform: translateY(0); transition: opacity .22s ease, transform .22s ease; }
    .content-fade.is-transitioning { opacity: 0; transform: translateY(6px); }
    .todo-card { position: relative; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 13px; align-items: start; padding: 15px 15px 14px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--panel); cursor: pointer; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease, opacity .25s ease; }
    .todo-card:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: var(--shadow-small); }
    .todo-card.is-exiting, .journal-entry.is-exiting { opacity: 0; transform: translateY(-8px) scale(.99); pointer-events: none; }
    .check-button { width: 28px; height: 28px; margin-top: 1px; border: 1.5px solid var(--line-strong); border-radius: 50%; background: var(--panel-soft); color: transparent; display: inline-flex; align-items: center; justify-content: center; }
    .check-button:hover, .check-button:focus-visible { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .check-button svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .todo-text { margin: 0 0 5px; color: var(--text); font-size: 15px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
    .action-cluster { display: inline-flex; align-items: center; gap: 6px; }
    .action-anchor { position: relative; display: inline-flex; }
    .icon-button { width: 34px; height: 34px; border: 1px solid transparent; border-radius: 11px; background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
    .icon-button:hover, .icon-button:focus-visible { color: var(--accent-dark); background: var(--accent-soft); }
    .icon-button svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .action-anchor[data-tip]:hover::after, .action-anchor[data-tip]:focus-within::after { content: attr(data-tip); position: absolute; top: calc(100% + 7px); right: 0; z-index: 10; padding: 5px 8px; border-radius: 7px; color: #fff; background: #41434b; font-size: 11px; white-space: nowrap; box-shadow: var(--shadow-small); }
    .note-panel { max-height: 0; opacity: 0; overflow: hidden; grid-column: 2 / -1; margin-top: -3px; transition: max-height .25s ease, opacity .2s ease, margin-top .25s ease; }
    .note-panel.is-open { max-height: 180px; opacity: 1; margin-top: 1px; }
    .reflection-input { width: 100%; min-height: 94px; padding: 11px 12px; resize: vertical; border: 1px solid var(--line); border-radius: 13px; color: var(--text); background: var(--panel-soft); line-height: 1.7; outline: none; }
    .confirm-pop { position: absolute; top: calc(100% + 7px); right: 0; z-index: 12; width: 204px; padding: 11px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); box-shadow: 0 16px 30px rgba(54, 45, 47, .14); opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity .18s ease, transform .18s ease; }
    .confirm-pop.is-open { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .confirm-text { margin: 0 0 9px; color: var(--text-soft); font-size: 12px; line-height: 1.5; }
    .confirm-actions { display: flex; justify-content: flex-end; gap: 7px; }
    .confirm-button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-soft); color: var(--text-soft); cursor: pointer; font-size: 11px; }
    .confirm-button.is-primary { border-color: transparent; background: var(--accent); color: #fff; }
    .empty { padding: 26px 16px; border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); color: var(--muted); background: var(--panel-soft); text-align: center; font-size: 13px; line-height: 1.8; }
    .empty-heart { display: block; margin-bottom: 7px; color: var(--accent); font-size: 21px; }
    .journal-group { display: grid; gap: 9px; }
    .journal-date { display: flex; align-items: center; gap: 9px; margin: 2px 0 3px; color: var(--accent-dark); font-size: 13px; font-weight: 700; }
    .journal-date::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .journal-entry { position: relative; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--panel); transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease, opacity .25s ease; }
    .journal-entry:hover { transform: translateY(-2px); border-color: var(--line-strong); box-shadow: var(--shadow-small); }
    .journal-main { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 11px; }
    .journal-task { margin: 0 0 9px; font-size: 14px; font-weight: 700; line-height: 1.55; word-break: break-word; }
    .journal-reflection { margin: 0 0 10px; padding: 10px 11px; border-radius: 12px; background: var(--panel-soft); color: var(--text-soft); font-size: 12px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .journal-reflection.is-empty { color: var(--muted); font-style: italic; }

    .auth-gate { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; padding: 22px; background: rgba(251, 248, 244, .88); backdrop-filter: blur(18px); }
    .auth-gate.is-open { display: grid; }
    .auth-card { width: min(430px, 100%); padding: 32px; border: 1px solid var(--line); border-radius: var(--radius-xl); background: var(--panel); box-shadow: 0 24px 70px rgba(78, 57, 55, .16); }
    .auth-heart { width: 48px; height: 48px; margin-bottom: 23px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; color: #fff; background: var(--accent); transform: rotate(-6deg); }
    .auth-heart svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .auth-title { margin: 0 0 18px; font-size: 30px; line-height: 1.25; }
    .auth-form { display: grid; gap: 10px; }
    .auth-input { width: 100%; min-height: 52px; padding: 0 16px; border: 1px solid var(--line); border-radius: var(--radius-md); color: var(--text); background: var(--panel-soft); outline: none; }
    .auth-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .auth-button { min-height: 52px; border: 0; border-radius: var(--radius-md); color: #fff; background: var(--accent); cursor: pointer; font-weight: 700; }
    .auth-button:disabled { cursor: wait; opacity: .65; }
    .auth-message { min-height: 20px; margin: 10px 0 0; color: var(--text-soft); font-size: 13px; line-height: 1.6; }
    .auth-message.is-error { color: var(--accent-dark); }
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 60; max-width: min(420px, calc(100vw - 32px)); padding: 11px 15px; border-radius: 12px; color: #fff; background: #41434b; box-shadow: var(--shadow); opacity: 0; transform: translate(-50%, 10px); pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
    .toast.is-open { opacity: 1; transform: translate(-50%, 0); }
    [hidden] { display: none !important; }

    @media (max-width: 820px) {
      .page { width: min(100vw - 28px, 680px); padding-top: 18px; }
      .welcome { grid-template-columns: 1fr; min-height: 0; }
      .welcome-copy { padding-bottom: 18px; }
      .welcome-visual { min-height: 176px; }
      .visual-sun { width: 156px; height: 156px; }
      .person-bubble { width: 66px; height: 66px; font-size: 20px; }
      .heart-connector { margin-bottom: 41px; }
      .workspace { grid-template-columns: 1fr; }
      .side-column { grid-template-columns: repeat(2, minmax(0,1fr)); align-items: start; }
    }
    @media (max-width: 560px) {
      .topbar { align-items: flex-start; }
      .brand-name { font-size: 16px; }
      .welcome-copy { padding: 27px 23px 18px; }
      .welcome-title { font-size: 32px; }
      .welcome-footer { align-items: flex-start; flex-direction: column; gap: 8px; }
      .progress-track { width: 100%; }
      .composer, .task-panel, .memory-panel { padding: 19px; }
      .composer-row { grid-template-columns: 1fr; }
      .add-button { width: 100%; }
      .side-column { grid-template-columns: 1fr; }
      .todo-card { grid-template-columns: auto minmax(0,1fr); }
      .todo-card > .action-cluster { grid-column: 2; margin-top: -4px; }
      .note-panel { grid-column: 1 / -1; }
      .journal-main { grid-template-columns: 1fr; }
      .journal-main > .action-cluster { justify-content: flex-end; margin-top: -3px; }
      .auth-card { padding: 26px 22px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20.8 8.7c0 5.4-8.8 10.2-8.8 10.2S3.2 14.1 3.2 8.7A4.7 4.7 0 0 1 12 6.5a4.7 4.7 0 0 1 8.8 2.2Z"></path></svg></span>
        <div><p class="brand-name">日子有你</p></div>
      </div>
      <div class="topbar-actions">
